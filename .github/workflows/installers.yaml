  #     - name: Upload Artifact
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: ${{ env.APP }}-macos-zip
  #         path: build/macos/Build/Products/Release/${{ env.APP }}-${{github.ref_name}}-macos.zip

