# 20240803
#
# It runs R if we run from /snap/rattle/current/rattle
# It fails to run R if started from /snap/bin/rattle?
# See https://github.com/gjwgit/rattleng/issues/15
#
# For the linter errors see https://snapcraft.io/docs/linters-library

name: rattle
base: core22
version: 6.5.42
summary: Rattle Next Generation Data Science
description: |
  Rattle is the data scientists toolkit.

grade: stable
confinement: strict

#slots:
#  dbus-rattle:
#    interface: dbus
#    bus: session
#    name: com.togaware.rattle

apps:
  rattle:
    command: rattle
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - network
      - home
      - removable-media
#    - system-files
#    slots:
#      - dbus-rattle

parts:
  rattle:
    plugin: flutter
    source: .
    flutter-target: lib/main.dart
    build-packages:
      - clang
      - cmake
      - ninja-build
      - libgtk-3-dev
      - libblkid-dev
      - liblzma-dev
#    stage-packages:
#      - r-recommended

